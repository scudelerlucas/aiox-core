name: CI
# Story 6.1: GitHub Actions Cost Optimization
# Story TD-3: CI/CD Optimization & Test Coverage
# Issue #182: Docs-only PRs no longer need a separate skip workflow
# Consolidated CI workflow - single source of truth for validation
# Uses dorny/paths-filter for job-level skipping (docs-only PRs skip all jobs gracefully)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path-based change detection for smart job skipping
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
      config: ${{ steps.filter.outputs.config }}
      stories: ${{ steps.filter.outputs.stories }}
      ci: ${{ steps.filter.outputs.ci }}
      lifeboard_sql: ${{ steps.filter.outputs.lifeboard_sql }}
    steps:
      # NOTE: No 'submodules' parameter — pro/ submodule is intentionally
      # NOT checked out. aiox-core MUST work standalone without pro/.
      # See ADR-PRO-001 and Story PRO-5 (AC-7).
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - '.aiox-core/**'
              - 'bin/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tools/**'
            tests:
              - 'tests/**'
              - 'jest.config.js'
            config:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.eslintrc.*'
              - 'eslint.config.*'
            stories:
              - 'docs/stories/**'
            # MÉDIO 1 (rodada 12): o caminho do DINHEIRO do lifeboard. A
            # guarda de comportamento dele é SQL rodado contra um Postgres de
            # verdade (`lifeboard-sql` abaixo) — o vitest lê a GRAFIA do .sql e
            # passa mesmo quando o comportamento muda. O que a suíte cobre, e o
            # que ela ainda NÃO cobre, está escrito no cabeçalho do job.
            lifeboard_sql:
              - 'packages/lifeboard/supabase/**'
              - 'packages/lifeboard/scripts/rodar-suite-sql.sh'
            # Mudança no próprio CI precisa reexecutar o que valida o CI.
            # Sem isto, um PR que só mexe neste arquivo pula os jobs e entra
            # sem nunca ter sido exercido — foi o que aconteceu no PR #34.
            ci:
              - '.github/workflows/**'

  # Security audit - only fail on critical vulnerabilities
  # Note: high severity vulnerabilities in dev dependencies (semantic-release/npm/tar)
  # are accepted as they don't affect production users
  security-audit:
    name: Security Audit
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          echo "=== npm audit (critical level for dev dependencies) ==="
          # Only fail on critical vulnerabilities
          # High severity in dev-only dependencies (semantic-release chain) is accepted
          npm audit --audit-level=critical || {
            echo ""
            echo "⚠️ Critical vulnerabilities found!"
            echo "Run 'npm audit' locally for details."
            exit 1
          }
          echo "✅ No critical vulnerabilities found"

  lint:
    name: ESLint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Type Checking
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

  test:
    name: Jest Tests (Node ${{ matrix.node }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['18', '20', '22', '24', '25']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage threshold
        run: |
          echo "=== Coverage Threshold Check ==="
          # Coverage threshold is enforced by jest.config.js
          # Target: 80% overall, 85% for core modules

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────
  # Testes dos pacotes em packages/ — o job `test` acima NÃO os alcança.
  #
  # Medido em 17/09/2026: `jest.config.js` casa só `**/tests/**/*.test.js`,
  # e `tsconfig.json` não inclui `packages/`. Resultado: 1453 testes que
  # passam nunca rodaram no CI deste repositório, em três pacotes —
  #   @aiox/lifeboard   1342 (vitest, arquivos .ts/.tsx)
  #   @aiox/idea-inbox    68 (node --test, arquivos .mjs)
  #   @aiox/idea-forge    43 (node --test, arquivos .mjs)
  #
  # `@aiox/installer` fica de fora DE PROPÓSITO: os testes dele são
  # `.test.js` dentro de `tests/`, então o job `test` já os executa.
  #
  # Cada pacote roda o SEU próprio comando de teste — não se tenta unificar
  # o runner. E a verificação de tipos também é a do pacote: o `tsconfig.json`
  # da raiz não tem JSX nem DOM, então incluir `packages/` nele quebraria.
  #
  # Uma versão do Node basta: são suítes de pacote, não do framework.
  package-tests:
    name: Package Tests (workspaces)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: lifeboard - tests (vitest)
        run: npm test --workspace=@aiox/lifeboard

      - name: lifeboard - type checking
        run: npm run typecheck --workspace=@aiox/lifeboard

      # MÉDIO 1 (crítico da rodada 13): `checar-contraste.mjs` era a guarda da
      # régua de contraste (kernel-inicio item 6, >= 4,5:1) e NENHUMA automação
      # a chamava — ela aparecia só em três comentários, um deles o deste
      # arquivo, afirmando que ela guarda a tela. Agora ela roda aqui, no mesmo
      # job que roda o vitest e o tsc da tela, e falha o job quando um par de
      # cores cai abaixo da régua.
      - name: lifeboard - contraste da tela (>= 4,5:1)
        run: npm run contraste --workspace=@aiox/lifeboard

      - name: idea-forge - tests (node --test)
        run: npm test --workspace=@aiox/idea-forge

      - name: idea-inbox - tests (node --test)
        run: npm test --workspace=@aiox/idea-inbox

  # ───────────────────────────────────────────────────────────────────────────
  # MÉDIO 1 (rodada 12) — A GUARDA DE COMPORTAMENTO DO DINHEIRO RODA EM CI.
  #
  # `packages/lifeboard/supabase/tests/fila_prompts.test.sql` existe desde a
  # rodada 5 e não era executada por job nenhum: para o lifeboard o CI rodava
  # só `npm test` e `npm run typecheck`. O crítico da rodada 11 mediu o buraco
  # com uma linha — trocar `and f.custo_estimado_usd <= v_headroom` por
  # `… <= v_headroom + 100000` na migration faz o pull ignorar o teto do dia, e
  # os 1387 testes do vitest ficam VERDES, porque eles conferem a GRAFIA do
  # .sql, não o que o banco faz.
  #
  # O QUE ESTE JOB NÃO GARANTE (ALTO 2 da rodada 12 — a frase de antes prometia
  # cobertura que não existe). A suíte cobre o que os blocos dela NOMEIAM, e
  # nada mais. O crítico provou isso apagando `- v_execucao` do cálculo do
  # headroom: 68/68 blocos verdes, e seis pulls despachando US$ 720 contra um
  # teto de 500. Esse caso ganhou bloco (T69) na rodada 13; os buracos que
  # SOBRAM, medidos e nomeados, são:
  #   · parte das 44 funções do esquema não é chamada por bloco nenhum — o
  #     extrato do dia (`fila_prompts_extrato_do_dia`), `lifeboard_load`,
  #     `lifeboard_mutate`, `painel_fila_em_espera`, `painel_fila_na_fila` e os
  #     gatilhos, que só são conferidos por permissão (T19/T73).
  #     MÉDIO 4 (rodada 13): este parágrafo citava `fila_prompts_pegar` e
  #     `fila_prompts_fechar` como "as portas com segredo que embrulham as
  #     `_interno`" — as duas não existem desde a 0009 (linhas 518-519, `drop
  #     function if exists`), e nada as recriou. Quem chama as `_interno` é a
  #     Routine da conta, como papel `postgres`, sem porta intermediária;
  #   · nenhum bloco abre uma conexão como `anon`: as permissões são lidas por
  #     `has_function_privilege`, não exercidas;
  #   · a TELA não passa por aqui — quem a guarda é o vitest, o `tsc` e o
  #     `npm run contraste` (`scripts/checar-contraste.mjs`), os três no job
  #     `package-tests` acima;
  #   · o ambiente é um Postgres 16 com os stubs de `00-ambiente-de-teste.sql`,
  #     não o esquema completo do Supabase.
  # Em uma frase: este job pega mudança de comportamento no caminho que os
  # blocos percorrem, e é o único que pega. Ele não é prova de que o resto está
  # certo — é prova de que os casos do manifesto `supabase/tests/BLOCOS.txt`
  # continuam valendo. CRÍTICO 1 (rodada 13): o esperado vem desse manifesto,
  # por NOME; antes saía de um `grep -c` sobre o próprio arquivo da suíte, e
  # apagar um bloco deixava o job verde.
  #
  # Este job aplica as migrations `0001` … `NNNN` EM ORDEM num Postgres 16
  # limpo — o mesmo caminho do DEPLOY.md, que é o que pega migration fora de
  # ordem — e roda a suíte. Nada aqui toca produção: o banco é o serviço
  # efêmero do runner.
  # ───────────────────────────────────────────────────────────────────────────
  lifeboard-sql:
    name: Lifeboard SQL (comportamento do dinheiro)
    needs: changes
    if: ${{ needs.changes.outputs.lifeboard_sql == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifeboard_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Migrations em ordem + suíte de comportamento
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lifeboard_teste
        run: packages/lifeboard/scripts/rodar-suite-sql.sh

  story-validation:
    name: Story Checkbox Validation
    needs: changes
    if: ${{ needs.changes.outputs.stories == 'true' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate story checkboxes
        run: node .aiox-core/utils/aiox-validator.js stories

  manifest-validation:
    name: Install Manifest Validation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate install manifest
        run: npm run validate:manifest

  ide-sync-validation:
    name: IDE Command Sync Validation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate IDE sync
        run: npm run sync:ide:check

      - name: Report on failure
        if: failure()
        run: |
          echo "::error::IDE command files out of sync"
          echo "Run 'npm run sync:ide' locally and commit"
          npm run sync:ide:validate

  compatibility-parity-gate:
    name: Compatibility Parity Gate
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run compatibility parity gate
        run: npm run validate:parity

  semantic-lint:
    name: Semantic Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.stories == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run semantic lint
        run: npm run validate:semantic-lint

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [changes, security-audit, lint, typecheck, test, package-tests, lifeboard-sql, story-validation, manifest-validation, ide-sync-validation, installer-smoke-test, compatibility-parity-gate, dependency-validation, brownfield-install-test]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "=== AIOX CI Validation Summary ==="
          echo ""
          echo "📋 Change Detection:"
          echo "  Code changed: ${{ needs.changes.outputs.code }}"
          echo "  Tests changed: ${{ needs.changes.outputs.tests }}"
          echo "  Config changed: ${{ needs.changes.outputs.config }}"
          echo "  Stories changed: ${{ needs.changes.outputs.stories }}"
          echo ""
          echo "📊 Job Results:"
          echo "  Security Audit: ${{ needs.security-audit.result }}"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  TypeCheck: ${{ needs.typecheck.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Package Tests: ${{ needs.package-tests.result }}"
          echo "  Lifeboard SQL: ${{ needs.lifeboard-sql.result }}"
          echo "  Story Validation: ${{ needs.story-validation.result }}"
          echo "  Manifest Validation: ${{ needs.manifest-validation.result }}"
          echo "  IDE Sync Validation: ${{ needs.ide-sync-validation.result }}"
          echo "  Installer Smoke Test: ${{ needs.installer-smoke-test.result }}"
          echo "  Dependency Validation: ${{ needs.dependency-validation.result }}"
          echo "  Brownfield Install Test: ${{ needs.brownfield-install-test.result }}"
          echo ""

          # Check for failures (skipped is OK when changes don't affect that area)
          FAILED=false

          # Security Audit: fail if ran and didn't succeed
          if [ "${{ needs.security-audit.result }}" == "failure" ]; then
            echo "❌ Security audit failed (critical vulnerabilities found)"
            FAILED=true
          fi

          # Lint: fail if ran and didn't succeed
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "❌ ESLint check failed"
            FAILED=true
          fi

          # TypeCheck: fail if ran and didn't succeed
          if [ "${{ needs.typecheck.result }}" == "failure" ]; then
            echo "❌ TypeScript check failed"
            FAILED=true
          fi

          # Tests: fail if ran and didn't succeed
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Jest tests failed"
            FAILED=true
          fi

          # Package Tests: fail if ran and didn't succeed
          if [ "${{ needs.package-tests.result }}" == "failure" ]; then
            echo "❌ Package tests failed (lifeboard / idea-forge / idea-inbox)"
            FAILED=true
          fi

          # Lifeboard SQL: fail if ran and didn't succeed
          if [ "${{ needs.lifeboard-sql.result }}" == "failure" ]; then
            echo "❌ Lifeboard SQL behaviour suite failed (o caminho do dinheiro)"
            FAILED=true
          fi

          # Story Validation: fail if ran and didn't succeed
          if [ "${{ needs.story-validation.result }}" == "failure" ]; then
            echo "❌ Story validation failed"
            FAILED=true
          fi

          # Manifest Validation: fail if ran and didn't succeed
          if [ "${{ needs.manifest-validation.result }}" == "failure" ]; then
            echo "❌ Manifest validation failed"
            FAILED=true
          fi

          # IDE Sync: fail if ran and didn't succeed
          if [ "${{ needs.ide-sync-validation.result }}" == "failure" ]; then
            echo "❌ IDE sync validation failed"
            FAILED=true
          fi

          # Installer Smoke Test: fail if ran and didn't succeed
          if [ "${{ needs.installer-smoke-test.result }}" == "failure" ]; then
            echo "❌ Installer smoke test failed - WRONG WIZARD MAY BE USED!"
            FAILED=true
          fi

          # Dependency Validation (INS-4.12): fail if ran and didn't succeed
          if [ "${{ needs.dependency-validation.result }}" == "failure" ]; then
            echo "❌ Dependency validation failed - .aiox-core/package.json incomplete"
            FAILED=true
          fi

          # Brownfield Install Test (INS-4.12): fail if ran and didn't succeed
          if [ "${{ needs.brownfield-install-test.result }}" == "failure" ]; then
            echo "❌ Brownfield install test failed - brownfield users will see errors"
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "❌ One or more validation checks failed"
            exit 1
          fi

          echo "✅ All validation checks passed (skipped jobs are OK when no relevant changes)"

  # Performance monitoring (optional, informational only)
  performance:
    name: Performance Metrics
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Measure validation performance
        run: |
          echo "=== Validation Performance Metrics ==="

          echo "ESLint execution time:"
          time npm run lint || true

          echo -e "\nTypeScript execution time:"
          time npm run typecheck || true

          echo -e "\nStory validation time:"
          time node .aiox-core/utils/aiox-validator.js stories || true
        continue-on-error: true

  # SYNAPSE context engine benchmarks + E2E tests (Story SYN-12)
  synapse-benchmark:
    name: SYNAPSE Benchmark (Node ${{ matrix.node }})
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['18', '20', '22', '24', '25']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run SYNAPSE E2E tests
        run: npx jest tests/synapse/e2e/ --ci --verbose
        continue-on-error: true

      - name: Run SYNAPSE pipeline benchmark
        run: node tests/synapse/benchmarks/pipeline-benchmark.js --iterations=50 --json
        continue-on-error: true

  # Cross-platform testing - ONLY on main branch push
  # Moved from cross-platform-tests.yml (Story 6.1)
  cross-platform:
    name: Cross-Platform (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [changes, lint, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22', '24']
        # All combinations supported for Node.js 18-24 (isolated-vm removed in v3.11.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test CLI installation
        run: npm link
        continue-on-error: true

      - name: Test CLI basic commands
        run: |
          npx aiox-core --version || echo "CLI version check skipped"
          npx aiox-core --help || echo "CLI help check skipped"
        continue-on-error: true

  # INS-4.12: Dependency graph validation — ensures .aiox-core/package.json is complete
  dependency-validation:
    name: Dependency Validation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate .aiox-core dependency completeness
        run: node scripts/validate-aiox-core-deps.js

  # INS-4.12: Brownfield install test — simulates npm install in existing project
  brownfield-install-test:
    name: Brownfield Install Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pack aiox-core
        run: npm pack

      - name: Create brownfield test project
        run: |
          mkdir -p /tmp/brownfield-test
          cd /tmp/brownfield-test
          npm init -y

      - name: Install aiox-core in brownfield project
        run: |
          cd /tmp/brownfield-test
          TARBALL=$(ls ${{ github.workspace }}/aiox-core-*.tgz)
          npm install "$TARBALL"

      - name: Verify .aiox-core dependencies installable
        run: |
          cd /tmp/brownfield-test
          AIOX_CORE_DIR="node_modules/aiox-core/.aiox-core"
          if [ -f "$AIOX_CORE_DIR/package.json" ]; then
            cd "$AIOX_CORE_DIR"
            npm install --production --ignore-scripts
            echo "✅ .aiox-core dependencies installed successfully"
          else
            echo "⚠️ .aiox-core/package.json not found in installed package"
            exit 1
          fi

      - name: Verify key modules resolvable
        run: |
          cd /tmp/brownfield-test
          AIOX_NODE_MODULES="node_modules/aiox-core/.aiox-core/node_modules"
          MISSING=0

          for pkg in fast-glob fs-extra js-yaml semver ajv tar chalk; do
            if [ -d "$AIOX_NODE_MODULES/$pkg" ]; then
              echo "✅ $pkg found in .aiox-core/node_modules/"
            else
              echo "❌ $pkg MISSING from .aiox-core/node_modules/"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "FAIL: Some required modules are missing"
            exit 1
          fi

          echo ""
          echo "✅ All key modules resolvable in brownfield context"

  # Installer smoke test - ensures correct wizard is being used (Story 6.1.4)
  installer-smoke-test:
    name: Installer Smoke Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify wizard path in aiox.js
        run: |
          echo "=== Installer Smoke Test ==="
          echo ""
          echo "Checking bin/aiox.js uses correct wizard path..."

          # The wizard path should point to packages/installer/src/wizard/index.js
          if grep -q "packages.*installer.*src.*wizard" bin/aiox.js; then
            echo "✅ bin/aiox.js uses correct wizard path (packages/installer/src/wizard)"
          else
            echo "❌ ERROR: bin/aiox.js does NOT reference packages/installer/src/wizard"
            echo ""
            echo "Current wizard references in bin/aiox.js:"
            grep -n "wizard" bin/aiox.js || echo "No wizard references found"
            echo ""
            echo "This is a CRITICAL error - wrong installer will be used!"
            exit 1
          fi

      - name: Verify wizard file exists
        run: |
          echo "Checking wizard file exists..."

          if [ -f "packages/installer/src/wizard/index.js" ]; then
            echo "✅ packages/installer/src/wizard/index.js exists"
          else
            echo "❌ ERROR: packages/installer/src/wizard/index.js NOT FOUND"
            echo ""
            echo "Files in packages/installer/src/:"
            ls -la packages/installer/src/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi

      - name: Verify aiox-minimal.js uses router
        run: |
          echo "Checking bin/aiox-minimal.js uses main router..."

          if grep -q "aiox\.js" bin/aiox-minimal.js; then
            echo "✅ bin/aiox-minimal.js forwards to aiox.js router"
          else
            echo "⚠️  WARNING: bin/aiox-minimal.js may not use the main router"
            echo ""
            echo "Current content:"
            cat bin/aiox-minimal.js
          fi

      - name: Verify package.json files field
        run: |
          echo "Checking package.json includes all required paths..."

          # Check for required paths in files field
          REQUIRED_PATHS=("bin/" "packages/" ".aiox-core/")

          for path in "${REQUIRED_PATHS[@]}"; do
            if grep -q "\"$path\"" package.json; then
              echo "✅ package.json includes $path"
            else
              echo "❌ ERROR: package.json missing $path in files field"
              exit 1
            fi
          done

      - name: Summary
        run: |
          echo ""
          echo "=== Installer Smoke Test Complete ==="
          echo "✅ All installer checks passed"
          echo ""
          echo "The npm publish will use the correct wizard from:"
          echo "  packages/installer/src/wizard/index.js"

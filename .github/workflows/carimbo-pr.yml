# Carimbo de PR — confere que todo PR aberto por sessão do Claude diz QUEM o fez.
#
# Ordem do operador (13/10/2026): todo PR novo leva hora, conta Max (nome antes do @), título do chat,
# hashtag única do chat (#chat- + 6 últimos caracteres do id da sessão) e de onde rodou.
# Motivo medido no mesmo dia: o PR #1620 trazia só o link da sessão, que só abre na conta dona —
# a conta que fez o trabalho não podia ser descoberta pelo PR. Formato e fontes de cada campo:
# skill `.claude/skills/carimbo-pr/SKILL.md`.
#
# Só confere branch `claude/` (pessoa, Codex e Dependabot ficam de fora) e só PR criado a partir de
# 2026-10-13 22:00 UTC — PR antigo não fica vermelho de surpresa. Espelhado byte a byte do hub para os
# irmãos por scripts/sync-rules.mjs (3º canal); editar só no hub.
name: Carimbo de PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  conferir:
    name: Carimbo da sessão no corpo do PR
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conferir conta, chat e hora
        run: |
          criado=$(jq -r '.pull_request.created_at' "$GITHUB_EVENT_PATH")
          if [[ "$criado" < "2026-10-13T22:00:00Z" ]]; then
            echo "PR criado em $criado, antes da regra do carimbo — não conferido."
            exit 0
          fi
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r' > corpo.txt
          falta=()
          # Todo bloco v2 presente é conferido sozinho: num PR retomado por outro chat, um carimbo antigo
          # correto não pode esconder um carimbo novo errado (achados do Codex no #1688).
          rm -rf blocos && mkdir blocos
          awk 'index($0,"<!-- carimbo-pr v2 -->"){n++; d=1} d{print > ("blocos/" n)} /<!-- \/carimbo-pr -->/{d=0}' corpo.txt
          n=$(ls blocos | wc -l)
          for i in $(seq 1 "$n"); do
            b=$(cat "blocos/$i")
            grep -q '<!-- /carimbo-pr -->' <<<"$b" || falta+=("bloco $i: sem o fecho <!-- /carimbo-pr -->")
            grep -qE '^- Hora: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} \(São Paulo\)[[:space:]]*$|^- Hora: sem relógio' <<<"$b" || falta+=("bloco $i: a linha '- Hora: AAAA-MM-DD HH:MM (São Paulo)'")
            grep -qE '^- Conta: [^@[:space:]]+[[:space:]]*$' <<<"$b" || falta+=("bloco $i: a linha '- Conta:' só com o nome antes do @")
            grep -qE '^- Onde: .*[^[:space:]]' <<<"$b" || falta+=("bloco $i: a linha '- Onde:' (de onde a sessão rodou)")
            # Só vale o link canônico do claude.ai, com fronteira antes e depois do id.
            sess=$(grep -E '^- Chat: ' <<<"$b" | grep -oE '(^|[[:space:]])https://claude\.ai/code/session_[0-9A-Za-z]+([[:space:]]|$)' | head -1 | sed -E 's/.*session_([0-9A-Za-z]+).*/\1/')
            # Hashtag = "#chat-" + os 6 ÚLTIMOS caracteres do id (a parte aleatória). Os primeiros são a hora
            # de criação do chat e se repetem entre chats abertos no mesmo minuto. Mesma hashtag da regra
            # carimbo-de-publicacao, para uma busca só achar tudo o que o chat publicou.
            if [[ ${#sess} -lt 8 ]]; then
              falta+=("bloco $i: a linha '- Chat:' com o link completo https://claude.ai/code/session_… (id com 8 ou mais caracteres)")
            elif ! grep -qE "^- Busca: #chat-${sess: -6}[[:space:]]*$" <<<"$b"; then
              falta+=("bloco $i: a linha '- Busca: #chat-${sess: -6}' (os 6 últimos caracteres do id da sessão do link do Chat, e nada depois)")
            fi
          done
          # v1 só é aceito em PR aberto antes de 13/10/2026 23:00 UTC; daí em diante, ao menos um bloco v2.
          if (( n == 0 )); then
            if [[ "$criado" < "2026-10-13T23:00:00Z" ]] && grep -q '<!-- carimbo-pr v1 -->' corpo.txt; then
              b=$(awk 'index($0,"<!-- carimbo-pr v1 -->"){d=1} d{print} /<!-- \/carimbo-pr -->/{d=0}' corpo.txt)
              grep -qE '^- Hora: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} \(São Paulo\)|^- Hora: sem relógio' <<<"$b" || falta+=("a linha '- Hora: AAAA-MM-DD HH:MM (São Paulo)'")
              grep -qE '^- Conta: .*[^[:space:]]' <<<"$b" || falta+=("a linha '- Conta:'")
              grep -qE '^- Chat: .*https://claude\.ai/code/session_[0-9A-Za-z]{8}' <<<"$b" || falta+=("a linha '- Chat:' com o link da sessão")
            else
              falta+=("o bloco <!-- carimbo-pr v2 --> … <!-- /carimbo-pr -->")
            fi
          fi
          bloco="$(cat blocos/* 2>/dev/null || true)"
          if (( ${#falta[@]} )); then
            echo "::error title=PR sem carimbo da sessão::Falta no corpo do PR: $(IFS='; '; echo "${falta[*]}"). Formato: skill .claude/skills/carimbo-pr/SKILL.md. Corrige-se editando o corpo do PR."
            exit 1
          fi
          echo "Carimbo presente:"
          echo "$bloco"

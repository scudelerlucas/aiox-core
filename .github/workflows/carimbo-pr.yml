# Carimbo de PR — confere que todo PR aberto por sessão do Claude diz QUEM o fez.
#
# Ordem do operador (13/10/2026): todo PR novo leva hora, conta Max (nome antes do @), título do chat,
# hashtag única do chat (#chat + 8 caracteres do id da sessão) e de onde rodou.
# Motivo medido no mesmo dia: o PR #1620 trazia só o link da sessão, que só abre na conta dona —
# a conta que fez o trabalho não podia ser descoberta pelo PR. Formato e fontes de cada campo:
# skill `.claude/skills/carimbo-pr/SKILL.md`.
#
# Só confere branch `claude/` (pessoa, Codex e Dependabot ficam de fora) e só PR criado a partir de
# 2026-10-13 22:00 UTC — PR antigo não fica vermelho de surpresa. Espelhado byte a byte do hub para os
# irmãos por scripts/sync-rules.mjs (3º canal); editar só no hub.
name: Carimbo de PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  conferir:
    name: Carimbo da sessão no corpo do PR
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conferir conta, chat e hora
        run: |
          criado=$(jq -r '.pull_request.created_at' "$GITHUB_EVENT_PATH")
          if [[ "$criado" < "2026-10-13T22:00:00Z" ]]; then
            echo "PR criado em $criado, antes da regra do carimbo — não conferido."
            exit 0
          fi
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r' > corpo.txt
          falta=()
          # v2 a partir de 13/10/2026 23:00 UTC (com Busca e conta sem @); antes disso, aceita a v1.
          if [[ "$criado" < "2026-10-13T23:00:00Z" ]] && grep -q '<!-- carimbo-pr v1 -->' corpo.txt; then
            bloco=$(awk 'index($0,"<!-- carimbo-pr v1 -->"){d=1} d{print} /<!-- \/carimbo-pr -->/{d=0}' corpo.txt)
            grep -qE '^- Hora: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} \(São Paulo\)|^- Hora: sem relógio' <<<"$bloco" || falta+=("a linha '- Hora: AAAA-MM-DD HH:MM (São Paulo)'")
            grep -qE '^- Conta: .+' <<<"$bloco" || falta+=("a linha '- Conta:'")
            grep -qE '^- Chat: .*claude\.ai/code/session_' <<<"$bloco" || falta+=("a linha '- Chat:' com o link da sessão")
          else
            # Cada bloco v2 é conferido sozinho: num PR retomado por outro chat, um carimbo antigo
            # correto não pode esconder um carimbo novo errado (achado do Codex no #1688).
            rm -rf blocos && mkdir blocos
            awk 'index($0,"<!-- carimbo-pr v2 -->"){n++; d=1} d{print > ("blocos/" n)} /<!-- \/carimbo-pr -->/{d=0}' corpo.txt
            n=$(ls blocos | wc -l)
            (( n > 0 )) || falta+=("o bloco <!-- carimbo-pr v2 --> … <!-- /carimbo-pr -->")
            for i in $(seq 1 "$n"); do
              b=$(cat "blocos/$i")
              grep -q '<!-- /carimbo-pr -->' <<<"$b" || falta+=("bloco $i: sem o fecho <!-- /carimbo-pr -->")
              grep -qE '^- Hora: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} \(São Paulo\)$|^- Hora: sem relógio' <<<"$b" || falta+=("bloco $i: a linha '- Hora: AAAA-MM-DD HH:MM (São Paulo)'")
              grep -qE '^- Conta: [^@]+$' <<<"$b" || falta+=("bloco $i: a linha '- Conta:' só com o nome antes do @")
              sess=$(grep -E '^- Chat: ' <<<"$b" | grep -oE 'claude\.ai/code/session_[0-9A-Za-z]*' | head -1 | sed 's/.*session_//')
              if [[ ${#sess} -lt 8 ]]; then
                falta+=("bloco $i: a linha '- Chat:' com o link completo da sessão (id com 8 ou mais caracteres)")
              elif ! grep -qE "^- Busca: #chat${sess:0:8}([^0-9A-Za-z]|$)" <<<"$b"; then
                falta+=("bloco $i: a linha '- Busca: #chat${sess:0:8}' (os 8 primeiros caracteres do id da sessão do link do Chat)")
              fi
            done
            bloco="$(cat blocos/* 2>/dev/null || true)"
          fi
          if (( ${#falta[@]} )); then
            echo "::error title=PR sem carimbo da sessão::Falta no corpo do PR: $(IFS='; '; echo "${falta[*]}"). Formato: skill .claude/skills/carimbo-pr/SKILL.md. Corrige-se editando o corpo do PR."
            exit 1
          fi
          echo "Carimbo presente:"
          echo "$bloco"
